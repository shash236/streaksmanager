name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'streakmanserver/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'streakmanserver/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./streakmanserver

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Grant execute permission for mvnw
      run: chmod +x mvnw

    - name: Build with Maven
      run: ./mvnw clean package -DskipTests

    # - name: Run Tests
    #   run: ./mvnw test # will add them later

    - name: Build Docker Image
      run: docker build . --file Dockerfile --tag streakmanserver:latest

    # Future steps:
    # - Login to Docker Hub / GHCR
    # - Push Docker Image
    # - Deploy to AWS EC2 (via SSH or AWS CodeDeploy)

