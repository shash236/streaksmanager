name: Backend CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ "main" ]
    paths:
      - 'streakmanserver/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'streakmanserver/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./streakmanserver

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Grant execute permission for mvnw
      run: chmod +x mvnw

    - name: Build with Maven
      run: ./mvnw clean package -DskipTests

    # - name: Run Tests
    #   run: ./mvnw test # will add them later

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}/streakmanserver
        tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./streakmanserver
        file: ./streakmanserver/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd streaksmanager
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f

      - name: Verify Deployment Health
        run: |
          echo "Waiting for service to start up..."
          sleep 15
          
          # Health check URL
          HEALTH_URL="https://api.streakman-beta.shashwatik.me/actuator/health"
          echo "Checking health status at $HEALTH_URL"
          
          for i in {1..12}; do
            if curl -s $HEALTH_URL | grep -q '"status":"UP"'; then
               echo "Health check passed! Service is UP and reachable."
               exit 0
            fi
            echo "Attempt $i/12: Service not ready yet. Retrying in 5s..."
            sleep 5
          done
          
          echo "Health check failed after 60 seconds. Service might be down or unreachable."
          exit 1

